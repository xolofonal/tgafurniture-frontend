<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TGA Furniture</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="TGA Furniture Logo" class="site-logo-img custom-logo-large">
      </a>
      <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
  </header>

  <section class="section-padding">
    <div class="section-header center">
      <h2 class="section-title wooden-text-surface">Contact Us</h2>
      <p>Get in touch with our team or send us a message directly.</p>
    </div>

    <div class="contact-grid-container">
      <!-- Web3Forms Message Form Integration -->
      <div class="contact-form-box glass-card">
        <h3>Send Us A Message</h3>
        <form action="https://api.web3forms.com/submit" method="POST">
          <!-- Web3Forms Access Key -->
          <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
          
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="+94 7X XXX XXXX" required>
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea name="message" rows="4" placeholder="Type your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block wooden-surface-btn">Send Message</button>
        </form>
      </div>

      <!-- Showrooms & Google Maps -->
      <div class="contact-info-box glass-card">
        <h3>Our Showroom Branches</h3>
        
        <div class="branch-info-item">
          <h4><i class="fa-solid fa-location-dot"></i> Galenbidunuwawa Branch</h4>
          <p><i class="fa-solid fa-phone"></i> +94 11 234 5678</p>
          <div class="map-embed">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31558.106579848525!2d80.6811213!3d8.5361254!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3afcf1e0cb977d29%3A0x6b30141f23bb1d97!2sGalenbindunuwewa!5e0!3m2!1sen!2slk!4v1700000000000!5m2!1sen!2slk" 
              width="100%" height="150" style="border:0; border-radius:12px; margin-top:10px;" allowfullscreen="" loading="lazy">
            </iframe>
          </div>
        </div>

        <div class="branch-info-item" style="margin-top:25px;">
          <h4><i class="fa-solid fa-location-dot"></i> Mihinthale Branch</h4>
          <p><i class="fa-solid fa-phone"></i> +94 81 222 3344</p>
          <div class="map-embed">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31562.903823481235!2d80.4901243!3d8.3518214!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3afc899320d43a6d%3A0x2f6412140a87a634!2sMihintale!5e0!3m2!1sen!2slk!4v1700000000000!5m2!1sen!2slk" 
              width="100%" height="150" style="border:0; border-radius:12px; margin-top:10px;" allowfullscreen="" loading="lazy">
            </iframe>
          </div>
        </div>

        <h3 style="margin-top: 30px;">Follow Us</h3>
        <div class="social-links-container">
          <a href="#" class="social-btn facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="social-btn instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" class="social-btn whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
          <a href="#" class="social-btn youtube"><i class="fa-brands fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
