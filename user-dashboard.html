<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - My Account</title>
  <div id="adminDashboard" class="admin-layout hidden" style="display: none;"></div>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
    .nav-bar { background: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
    .nav-bar a { color: white; text-decoration: none; font-weight: 600; }
    .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .user-profile-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
    .orders-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .order-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-top: 15px; }
    .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 10px; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .status-pending { background: #fef3c7; color: #d97706; }
    .status-delivered { background: #d1fae5; color: #059669; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <h2><i class="fa-solid fa-user-gear"></i> My Account</h2>
    <a href="index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
  </div>

  <div class="dashboard-container">
    <div class="user-profile-card">
      <div>
        <h3 id="userName">User Name</h3>
        <p id="userEmail" style="color: #64748b; margin: 5px 0 0 0;">user@example.com</p>
      </div>
      <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>

    <div class="orders-section">
      <h3><i class="fa-solid fa-box-open"></i> Order History & Status</h3>
      <div id="ordersList">
        <!-- Dynamic Orders -->
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user) {
        alert("Please login first!");
        window.location.href = "index.html";
        return;
      }

      document.getElementById("userName").innerText = user.name || "Customer";
      document.getElementById("userEmail").innerText = user.email || "";

      fetchOrders(user.email);
    });

    async function fetchOrders(email) {
      const list = document.getElementById("ordersList");
      try {
        const res = await fetch(`http://localhost:5000/api/orders/user/${email}`);
        const orders = await res.json();

        if (!orders || orders.length === 0) {
          list.innerHTML = `<p style="color: #94a3b8; text-align: center; margin: 30px 0;">No orders found yet.</p>`;
          return;
        }

        list.innerHTML = orders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <div><strong>Order ID:</strong> #${order._id ? order._id.substring(0, 8) : 'N/A'}</div>
              <span class="status-badge ${order.status === 'Delivered' ? 'status-delivered' : 'status-pending'}">${order.status || 'Processing'}</span>
            </div>
            <div><strong>Items:</strong> ${order.items ? order.items.map(i => `${i.title} (x${i.quantity})`).join(', ') : ''}</div>
            <div style="margin-top: 8px; font-weight: bold;">Total: LKR ${order.totalAmount ? order.totalAmount.toLocaleString() : 0}</div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<p style="color: #ef4444;">Failed to load orders. Make sure backend is running.</p>`;
      }
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
