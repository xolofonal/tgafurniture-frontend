<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - TGA Furniture</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="checkout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-grid">
      
      <!-- Left Side Wrapper -->
      <div class="checkout-left-column">
        
        <!-- Order Type Selection -->
        <div class="checkout-card" style="margin-bottom: 20px;">
          <h3 style="margin-bottom: 16px; margin-top: 0;"><i class="fa-solid fa-truck"></i> Select Order Type</h3>
          
          <div class="order-type-grid">
            <label class="shipping-option">
              <input type="radio" name="checkout_shipping" id="chk-delivery" value="delivery" checked onchange="toggleCheckoutDelivery(true)">
              <div class="option-content">
                <i class="fa-solid fa-house"></i>
                <span>Home Delivery</span>
                <small>LKR 2,500.00</small>
              </div>
            </label>
            
            <label class="shipping-option">
              <input type="radio" name="checkout_shipping" id="chk-pickup" value="pickup" onchange="toggleCheckoutDelivery(false)">
              <div class="option-content">
                <i class="fa-solid fa-store"></i>
                <span>Store Pickup</span>
                <small>Free</small>
              </div>
            </label>
          </div>
        </div>

        <!-- Customer Billing Form -->
        <div class="checkout-card">
          <h2 class="checkout-title"><i class="fa-solid fa-user-check"></i> Customer Details</h2>
          <form id="checkoutForm">
            <div class="form-row">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" id="first_name" required placeholder="John">
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="last_name" required placeholder="Doe">
              </div>
            </div>

            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="phone" required placeholder="0771234567">
            </div>

            <!-- Delivery තේරූ විට පමණක් පෙන්වයි -->
            <div id="address-section">
              <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="address" placeholder="No. 123, Main Street">
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label>City</label>
                  <input type="text" id="city" placeholder="Colombo">
                </div>
              </div>
            </div>

            <button type="submit" class="btn-payhere" style="background-color: #25D366; background-image: none;">
              <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Send Order via WhatsApp
            </button>
          </form>
        </div>

      </div>

      <!-- Right Side: Order Summary -->
      <div class="checkout-card order-summary-card">
        <h2 class="checkout-title"><i class="fa-solid fa-bag-shopping"></i> Order Summary</h2>
        <div id="checkout-items-list" class="summary-items"></div>
        <div class="summary-divider"></div>
        <div class="summary-line"><span>Subtotal</span><span id="checkout-subtotal">LKR 0.00</span></div>
        <div class="summary-line"><span>Delivery Fee</span><span id="checkout-delivery">LKR 0.00</span></div>
        <div class="summary-line total"><span>Total Amount</span><span id="checkout-total">LKR 0.00</span></div>
      </div>

    </div>
  </div>

<script src="checkout.js"></script>
</body>
</html>
